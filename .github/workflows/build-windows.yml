name: Build Windows Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build CLI & Server binaries
        run: cargo build --release --workspace

      - name: Build Tauri Desktop GUI & Windows Installers
        working-directory: ./crates/mailbackup-gui
        run: cargo tauri build

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mailbackup-windows-x64
          path: |
            target/release/mailbackup-cli.exe
            target/release/mailbackup-server.exe
            target/release/mailbackup-gui.exe
            **/target/release/bundle/nsis/*.exe
            **/target/release/bundle/msi/*.msi
          if-no-files-found: warn

  # The minimum supported Rust version on Windows (issue #47): the whole
  # workspace, including the GUI's Windows-only dependencies, checked on
  # exactly the `rust-version` toolchain with the committed lockfile
  msrv-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check on the minimum supported Rust version
        run: cargo check --workspace --all-targets --locked
