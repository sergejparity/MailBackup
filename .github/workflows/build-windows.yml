name: Build Windows Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

# Read-only token: building needs nothing more. Only the `publish` job, which
# runs for `v*` tag pushes, gets write access (issue #81).
permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Exact versions of tools the release build installs. Dependabot doesn't
  # update these (only `uses:` lines): bump them here deliberately.
  TAURI_CLI_VERSION: 2.12.4

# Actions are pinned to commit SHAs (the comment names the release); Dependabot
# keeps them current.

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (master)
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "=${{ env.TAURI_CLI_VERSION }}" --locked

      # --locked: the release is built from exactly the committed Cargo.lock
      - name: Build CLI & Server binaries
        run: cargo build --release --workspace --locked

      - name: Build Tauri Desktop GUI & Windows Installers
        working-directory: ./crates/mailbackup-gui
        run: cargo tauri build -- --locked

      # upload-artifact's if-no-files-found only fails when nothing at all
      # matches, so a single missing binary would go unnoticed: check each
      # required output by name first
      - name: Check that every release output exists
        shell: pwsh
        run: |
          $missing = @()
          foreach ($exe in 'mailbackup.exe', 'mailbackup-server.exe', 'mailbackup-gui.exe') {
            if (-not (Test-Path "target/release/$exe")) { $missing += "target/release/$exe" }
          }
          $nsis = @(Get-ChildItem -Path target/release/bundle/nsis -Filter *.exe -ErrorAction SilentlyContinue)
          $msi = @(Get-ChildItem -Path target/release/bundle/msi -Filter *.msi -ErrorAction SilentlyContinue)
          if ($nsis.Count -ne 1) { $missing += "exactly one NSIS installer (found $($nsis.Count))" }
          if ($msi.Count -ne 1) { $missing += "exactly one MSI installer (found $($msi.Count))" }
          if ($missing.Count -gt 0) {
            $missing | ForEach-Object { Write-Error "Missing: $_" -ErrorAction Continue }
            exit 1
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mailbackup-windows-x64
          path: |
            target/release/mailbackup.exe
            target/release/mailbackup-server.exe
            target/release/mailbackup-gui.exe
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error

  # Publishing a tag's release (issue #81). The only job with write access,
  # and it runs nothing from the build: it takes the build job's artifact,
  # writes SHA256SUMS, attests provenance and creates the release. The release
  # stays a draft until the files downloaded back from it have been checked
  # against SHA256SUMS and their attestations, so a broken upload never
  # becomes a published release.
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download the build's artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mailbackup-windows-x64
          path: artifact

      # One flat folder of release files; the CLI is named for the platform so
      # it can't be mistaken for another platform's build later
      - name: Collect release files and write SHA256SUMS
        run: |
          set -euo pipefail
          mkdir dist
          cp artifact/mailbackup.exe dist/mailbackup-cli-windows-x64.exe
          cp artifact/mailbackup-server.exe dist/mailbackup-server-windows-x64.exe
          cp artifact/mailbackup-gui.exe dist/mailbackup-gui-windows-x64.exe
          cp artifact/bundle/nsis/*.exe artifact/bundle/msi/*.msi dist/
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.exe
            dist/*.msi

      - name: Create the release as a draft
        run: |
          gh release create "$TAG" dist/* --draft --verify-tag \
            --title "MailBackup $TAG" --generate-notes

      - name: Verify the uploaded files
        run: |
          set -euo pipefail
          mkdir verify
          gh release download "$TAG" --dir verify
          cd verify
          sha256sum -c SHA256SUMS
          # Every file in the release must be listed, not only listed files
          # present
          diff <(ls -1 | grep -vx SHA256SUMS | sort) <(awk '{print $2}' SHA256SUMS | sort)
          for f in *.exe *.msi; do
            gh attestation verify "$f" --repo "$GH_REPO"
          done

      - name: Publish the release
        run: gh release edit "$TAG" --draft=false

  # The minimum supported Rust version on Windows (issue #47): the whole
  # workspace, including the GUI's Windows-only dependencies, checked on
  # exactly the `rust-version` toolchain with the committed lockfile
  msrv-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (master)
        with:
          toolchain: 1.98.0

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check on the minimum supported Rust version
        run: cargo check --workspace --all-targets --locked
