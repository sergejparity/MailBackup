name: Build Windows Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^1.6"

      - name: Build CLI & Server binaries
        run: cargo build --release --workspace

      - name: Build Tauri Desktop GUI & Windows Installers
        working-directory: ./crates/mailbackup-gui
        run: cargo tauri build

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mailbackup-windows-x64
          path: |
            target/release/mailbackup-cli.exe
            target/release/mailbackup-server.exe
            crates/mailbackup-gui/target/release/bundle/nsis/*.exe
            crates/mailbackup-gui/target/release/bundle/msi/*.msi
            crates/mailbackup-gui/target/release/mailbackup-gui.exe
          if-no-files-found: warn
