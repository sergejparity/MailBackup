name: CI (Linux)

# Tests, lints and a dependency audit for the whole workspace, the desktop
# GUI included (Tauri 2 uses webkit2gtk-4.1, which current Ubuntu ships).

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  # New advisories appear without any change here, so audit daily too
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-linux-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install GUI system libraries
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Run tests
        run: cargo test --workspace --locked

  clippy:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Pinned so a new stable release can't fail CI with lints nobody
      # introduced; bump it deliberately
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install GUI system libraries
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # The minimum supported Rust version (`rust-version` in Cargo.toml, issue
  # #47): the whole workspace, GUI included, built and tested on exactly that
  # toolchain with the committed lockfile. Keep the version here and in
  # Cargo.toml in step
  msrv:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.90.0

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install GUI system libraries
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Test on the minimum supported Rust version
        run: cargo test --workspace --all-targets --locked

  # Declared but unused dependencies (issues #40, #41)
  unused-deps:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete

      - name: Find unused dependencies
        run: cargo machete

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Checks the committed workspace Cargo.lock (GUI dependencies included)
      # against a freshly fetched advisory database. Vulnerabilities and fetch
      # errors fail the job; warnings (unmaintained, unsound, yanked) are
      # reported without failing it
      - name: Audit dependencies
        run: cargo audit
