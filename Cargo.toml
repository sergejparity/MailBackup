[workspace]
members = [
    "crates/mailbackup-core",
    "crates/mailbackup-cli",
    "crates/mailbackup-server",
    "crates/mailbackup-gui",
]
resolver = "3"

[workspace.package]
version = "0.8.9"
edition = "2024"
rust-version = "1.98"
authors = ["SP"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_norway = "0.9"
rusqlite = { version = "0.41", features = ["bundled", "bundled-full", "chrono", "uuid", "fallible_uint"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
sha2 = "0.11"
hex = "0.4"
# full_encoding: legacy charsets (Shift_JIS, GB2312, KOI8-R, …); 0.9 had it on by default
mail-parser = { version = "1.0.1", features = ["full_encoding"] }
keyring = "4.2"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "7.0"
tokio-cron-scheduler = "0.15"
clap = { version = "4.5", features = ["derive", "env"] }
indicatif = { version = "0.18", features = ["tokio"] }
dialoguer = { version = "0.12", features = ["password"] }
console = "0.16"
axum = "0.8"
tower-http = { version = "0.7", features = ["trace"] }
rust-embed = { version = "8.5", features = ["mime-guess"] }
mime_guess = "2.0"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio", "compress"] }
tokio-rustls = "0.26"
rustls-pki-types = "1.8"
webpki-roots = "1.0"
futures-util = "0.3"
aes-gcm = "0.11"
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
base64 = "0.23"
csv = "1.3"
