[workspace]
members = [
    "crates/mailbackup-core",
    "crates/mailbackup-cli",
    "crates/mailbackup-server",
    "crates/mailbackup-gui",
]
exclude = ["vendor/imap-proto"]
resolver = "2"

[workspace.package]
version = "0.6.0"
edition = "2021"
authors = ["SP"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
rusqlite = { version = "0.32", features = ["bundled", "bundled-full", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
mail-parser = "0.9"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5.0"
regex = "1.10"
async-trait = "0.1"
tokio-cron-scheduler = "0.13"
clap = { version = "4.5", features = ["derive", "env"] }
indicatif = { version = "0.17", features = ["tokio"] }
dialoguer = { version = "0.11", features = ["password"] }
console = "0.15"
axum = { version = "0.7", features = ["ws", "macros"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
rust-embed = { version = "8.5", features = ["mime-guess"] }
mime_guess = "2.0"
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio", "compress"] }
tokio-rustls = "0.26"
rustls-pki-types = "1.8"
webpki-roots = "0.26"
futures-util = "0.3"
aes-gcm = "0.10"
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
base64 = "0.22"
csv = "1.3"

# imap-proto with RFC 8474 EMAILID parsing (issue #33); see
# vendor/imap-proto/PATCHES.md. Drop once an upstream release has it.
[patch.crates-io]
imap-proto = { path = "vendor/imap-proto" }
