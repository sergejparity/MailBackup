[workspace]
members = [
    "crates/mailbackup-core",
    "crates/mailbackup-cli",
    "crates/mailbackup-server",
    "crates/mailbackup-gui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["SP"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
rusqlite = { version = "0.32", features = ["bundled", "bundled-full", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
mail-parser = "0.9"
keyring = "3.0"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5.0"
regex = "1.10"
async-trait = "0.1"
tokio-cron-scheduler = "0.13"
clap = { version = "4.5", features = ["derive", "env"] }
indicatif = { version = "0.17", features = ["tokio"] }
dialoguer = { version = "0.11", features = ["password"] }
console = "0.15"
axum = { version = "0.7", features = ["ws", "macros"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
rust-embed = { version = "8.5", features = ["mime-guess"] }
mime_guess = "2.0"
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = "0.26"
rustls-pki-types = "1.8"
webpki-roots = "0.26"
futures-util = "0.3"
