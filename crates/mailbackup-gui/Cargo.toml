[package]
name = "mailbackup-gui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
mailbackup-core = { path = "../mailbackup-core" }
mailbackup-server = { path = "../mailbackup-server" }
tauri = { version = "1.6", features = ["system-tray"] }
tauri-plugin-single-instance = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "1e407ed56455558cf751022fd68eca3b9e3713a0" }
tokio.workspace = true
tracing-subscriber = { workspace = true }
dirs = { workspace = true }

[features]
# this feature is used for production builds or when `distDir` points to the filesystem
# DO NOT REMOVE!!
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

